# Vérifications sans ROM : syntaxe des scripts, atlas de police, lint des traductions, compilation des tests C.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: tools/check.sh fr en
